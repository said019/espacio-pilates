# nixpacks.toml — Configuración de build para Railway
# Railway detecta automáticamente Node.js; esto lo hace explícito.

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npm run build", "if [ \"$SERVE_MODE\" = \"frontend\" ]; then node scripts/prepare-static-runtime.mjs; fi"]

[start]
cmd = "sh start.sh"
